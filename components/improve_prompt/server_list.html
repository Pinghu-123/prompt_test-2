<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111314">
  <title>Improve_Prompt - server_list</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1112;
      --sidebar: #141617;
      --surface: #181a1b;
      --surface-strong: #1d2021;
      --surface-hover: #222526;
      --line: #2b2f30;
      --line-strong: #3a3f40;
      --text: #f4f5f4;
      --text-soft: #b8bdbc;
      --muted: #7e8583;
      --accent: #d9ff66;
      --accent-soft: rgba(217, 255, 102, 0.12);
      --blue: #8ec8ff;
      --danger: #ff7676;
      --danger-soft: rgba(255, 118, 118, 0.12);
      --success: #72dc9a;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 76% -14%, rgba(217, 255, 102, 0.055), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: block;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 282px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      width: 282px;
      height: 100vh;
      padding: 22px 16px 18px;
      overflow-y: auto;
      background: rgba(20, 22, 23, 0.97);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 0 8px;
      margin-bottom: 30px;
    }

    .brand__logo {
      position: relative;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      overflow: hidden;
      background: #0c0e0f;
      border: 1px solid #424849;
      border-radius: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .brand__logo::before,
    .brand__logo::after {
      position: absolute;
      width: 14px;
      height: 20px;
      content: "";
      border: 1.5px solid var(--accent);
      border-radius: 5px 5px 5px 1px;
      transform: rotate(-22deg) translate(-3px, 1px);
      opacity: 0.95;
    }

    .brand__logo::after {
      width: 8px;
      height: 13px;
      border-color: rgba(244, 245, 244, 0.74);
      transform: rotate(-22deg) translate(6px, -3px);
    }

    .brand__name {
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .nav-label {
      padding: 0 10px;
      margin-bottom: 9px;
      color: #666d6b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-tree {
      display: grid;
      gap: 4px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 40px;
      padding: 0 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-soft);
      cursor: pointer;
      text-align: left;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .nav-row:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.035);
    }

    .nav-row:focus-visible,
    .button:focus-visible,
    .icon-button:focus-visible,
    .link-button:focus-visible,
    input:focus-visible,
    .table-check:focus-visible {
      outline: 2px solid rgba(217, 255, 102, 0.7);
      outline-offset: 2px;
    }

    .nav-row--level1 {
      color: #e8eae9;
      font-weight: 650;
    }

    .nav-row--level2 {
      min-height: 36px;
      padding-left: 14px;
      color: #9fa5a4;
      font-size: 13px;
    }

    .nav-row--level3 {
      min-height: 34px;
      padding: 0 9px 0 34px;
      color: #818886;
      font-size: 13px;
    }

    .nav-row--level3::before {
      width: 4px;
      height: 4px;
      margin-right: 10px;
      background: currentColor;
      border-radius: 50%;
      content: "";
      opacity: 0.7;
    }

    .nav-row--level3:hover,
    .nav-row--level3.is-active {
      color: var(--text);
      background: var(--surface-hover);
      border-color: #303536;
    }

    .nav-row--level3.is-active::before {
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .nav-row--link {
      font-weight: 650;
    }

    .nav-row__icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-right: 8px;
      color: #8f9694;
      background: #1c1f20;
      border: 1px solid #2c3031;
      border-radius: 7px;
    }

    .nav-row__icon svg {
      width: 15px;
      height: 15px;
    }

    .nav-row__text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-row__chevron {
      width: 15px;
      height: 15px;
      margin-left: auto;
      color: #6f7674;
      transition: transform 180ms ease;
    }

    .nav-row[aria-expanded="false"] .nav-row__chevron {
      transform: rotate(-90deg);
    }

    .nav-subtree {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 180ms ease, opacity 180ms ease;
    }

    .nav-subtree[hidden] {
      display: none;
    }

    .nav-subtree__inner {
      display: grid;
      gap: 3px;
      min-height: 0;
      margin-top: 3px;
      overflow: hidden;
    }

    .nav-subtree--level3 .nav-subtree__inner {
      margin: 2px 0 5px 23px;
      padding-left: 8px;
      border-left: 1px solid #292d2e;
    }

    .sidebar__footer {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 10px;
      margin-top: auto;
      color: #737a78;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(114, 220, 154, 0.09);
    }

    .main {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 70px;
      padding: 14px clamp(18px, 3vw, 42px);
      background: rgba(15, 17, 18, 0.86);
      border-bottom: 1px solid rgba(43, 47, 48, 0.82);
      backdrop-filter: blur(18px);
    }

    .icon-button.menu-toggle {
      display: none;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: #727977;
      font-size: 12px;
      white-space: nowrap;
    }

    .breadcrumbs strong {
      overflow: hidden;
      color: #b6bbba;
      font-weight: 500;
      text-overflow: ellipsis;
    }

    .topbar__spacer {
      flex: 1;
    }

    .topbar__actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .button,
    .icon-button,
    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      background: #202324;
      border: 1px solid #303536;
      border-radius: 8px;
      color: #d8dcda;
      cursor: pointer;
      font-size: 13px;
      font-weight: 620;
      white-space: nowrap;
      transition: transform 150ms ease, color 150ms ease, background 150ms ease,
        border-color 150ms ease, opacity 150ms ease;
    }

    .button:hover:not(:disabled),
    .icon-button:hover:not(:disabled),
    .link-button:hover:not(:disabled) {
      color: #fff;
      background: #272b2c;
      border-color: #414748;
    }

    .button:active:not(:disabled),
    .icon-button:active:not(:disabled),
    .link-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .button:disabled {
      color: #656b69;
      background: #191b1c;
      border-color: #272a2b;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .button svg,
    .link-button svg,
    .icon-button svg {
      width: 16px;
      height: 16px;
    }

    .button--danger:not(:disabled) {
      color: #ffb6b6;
      background: var(--danger-soft);
      border-color: rgba(255, 118, 118, 0.24);
    }

    .button--danger:hover:not(:disabled) {
      color: #fff;
      background: rgba(255, 118, 118, 0.2);
      border-color: rgba(255, 118, 118, 0.42);
    }

    .button--primary {
      color: var(--text);
      background: #272b2c;
      border-color: #414748;
    }

    .button--primary:hover:not(:disabled) {
      color: #fff;
      background: #303536;
      border-color: #535a5b;
    }

    .button--primary svg {
      color: var(--accent);
    }

    .link-button {
      min-height: 34px;
      padding: 0 11px;
      background: transparent;
      border-color: transparent;
      color: #c8cdcb;
    }

    .icon-button {
      width: 38px;
      min-width: 38px;
      padding: 0;
    }

    .content {
      width: min(100%, 1540px);
      padding: 30px clamp(18px, 3vw, 42px) 48px;
      margin: 0 auto;
    }

    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .page-heading__eyebrow {
      margin: 0 0 8px;
      color: #737a78;
      font-size: 12px;
      font-weight: 650;
    }

    .page-heading h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 720;
      letter-spacing: 0;
    }

    .page-heading__meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(114, 220, 154, 0.09);
    }

    .panel {
      background: rgba(24, 26, 27, 0.97);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .search-panel {
      padding: 18px;
      margin-bottom: 14px;
    }

    .search-form {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) auto;
      align-items: end;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .field__label {
      color: #9ca2a0;
      font-size: 12px;
      font-weight: 620;
    }

    .input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      background: #121415;
      border: 1px solid #303536;
      border-radius: 7px;
      color: var(--text);
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .input::placeholder {
      color: #606765;
    }

    .input:hover {
      border-color: #3e4445;
    }

    .input:focus {
      background: #101213;
      border-color: rgba(217, 255, 102, 0.62);
      box-shadow: 0 0 0 3px rgba(217, 255, 102, 0.08);
    }

    .search-actions {
      display: flex;
      gap: 9px;
    }

    .table-panel {
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .table-toolbar__title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .table-toolbar__title strong {
      font-size: 14px;
      font-weight: 680;
    }

    .selected-count {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      color: #8f9694;
      background: #202324;
      border: 1px solid #2e3233;
      border-radius: 999px;
      font-size: 11px;
      white-space: nowrap;
    }

    .selected-count.has-selection {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(217, 255, 102, 0.22);
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.col-check {
      width: 54px;
    }

    col.col-platform {
      width: 27%;
    }

    col.col-company {
      width: 23%;
    }

    col.col-api {
      width: auto;
    }

    th,
    td {
      height: 60px;
      padding: 0 16px;
      border-bottom: 1px solid #282c2d;
      text-align: left;
      vertical-align: middle;
    }

    th {
      height: 46px;
      color: #777e7c;
      background: #17191a;
      font-size: 11px;
      font-weight: 720;
      letter-spacing: 0.045em;
      text-transform: uppercase;
    }

    tbody tr {
      background: #191b1c;
      transition: background 150ms ease;
    }

    tbody tr:hover {
      background: #1d2021;
    }

    tbody tr.is-selected {
      background: rgba(217, 255, 102, 0.035);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .checkbox-wrap {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      cursor: pointer;
    }

    .table-check {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .platform-cell,
    .company-cell {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      max-width: 100%;
      color: var(--blue);
      line-height: 1.35;
      text-decoration: underline;
      text-decoration-color: rgba(142, 200, 255, 0.34);
      text-underline-offset: 3px;
      transition: color 150ms ease, text-decoration-color 150ms ease;
    }

    .company-cell {
      color: #c8cdcb;
      text-decoration-color: rgba(200, 205, 203, 0.28);
    }

    .platform-cell:hover,
    .company-cell:hover {
      color: #fff;
      text-decoration-color: currentColor;
    }

    .platform-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      color: #0e100f;
      background: #d8dddc;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }

    .platform-mark--dark {
      color: #f0f2f1;
      background: #303536;
    }

    .api {
      display: block;
      overflow: hidden;
      color: #9ba19f;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: 28px;
      text-align: center;
    }

    .empty-state[hidden] {
      display: none;
    }

    .empty-state__icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 14px;
      color: #8c9391;
      background: #202324;
      border: 1px solid #303536;
      border-radius: 8px;
    }

    .empty-state h3 {
      margin: 0 0 7px;
      font-size: 15px;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 0 18px;
      color: #777e7c;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      background: transparent;
      border: 1px solid #2d3132;
      border-radius: 7px;
      color: #818886;
      cursor: pointer;
    }

    .page-button.is-current {
      color: #10120f;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 750;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(5, 6, 7, 0.72);
      backdrop-filter: blur(8px);
      animation: fade-in 160ms ease both;
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(100%, 520px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #191b1c;
      border: 1px solid #3a3f40;
      border-radius: 8px;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.52);
      animation: modal-in 180ms ease both;
    }

    .modal--confirm {
      width: min(100%, 440px);
    }

    .modal__header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal__header-copy {
      min-width: 0;
      flex: 1;
    }

    .modal__header h2 {
      margin: 0 0 5px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .modal__header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .modal__body {
      display: grid;
      gap: 15px;
      padding: 20px;
    }

    .confirm-copy {
      margin: 0;
      color: #b7bcba;
      font-size: 13px;
      line-height: 1.7;
    }

    .confirm-copy strong {
      color: var(--text);
    }

    .modal__footer {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      padding: 15px 20px 20px;
    }

    .toast-region {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 130;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 44px));
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      background: #202324;
      border: 1px solid #3c4242;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.38);
      color: #dce0de;
      font-size: 13px;
      line-height: 1.45;
      pointer-events: auto;
      animation: toast-in 220ms ease both;
    }

    .toast::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      margin-top: 5px;
      background: var(--accent);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .toast.is-leaving {
      animation: toast-out 180ms ease both;
    }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: none;
      background: rgba(4, 5, 6, 0.62);
      backdrop-filter: blur(3px);
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toast-out {
      to {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    @media (max-width: 1080px) {
      .app-shell {
        grid-template-columns: 244px minmax(0, 1fr);
      }

      .sidebar {
        width: 244px;
      }

      .search-form {
        grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr);
      }

      .search-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: fixed;
        left: 0;

  <script>
    const state = {
      servers: [],
      visibleIds: [],
      selectedIds: new Set(),
      filters: {
        platform: "",
        company: ""
      }
    };

    const tableBody = document.getElementById("serverTableBody");
    const emptyState = document.getElementById("emptyState");
    const selectAll = document.getElementById("selectAll");
    const selectedCount = document.getElementById("selectedCount");
    const deleteButton = document.getElementById("deleteButton");
    const totalCount = document.getElementById("totalCount");
    const footerCount = document.getElementById("footerCount");
    const searchForm = document.getElementById("searchForm");
    const platformSearch = document.getElementById("platformSearch");
    const companySearch = document.getElementById("companySearch");
    const deleteModal = document.getElementById("deleteModal");
    const deleteConfirmCopy = document.getElementById("deleteConfirmCopy");
    const sidebar = document.getElementById("sidebar");
    const mobileOverlay = document.getElementById("mobileOverlay");
    const menuToggle = document.getElementById("menuToggle");
    const toastRegion = document.getElementById("toastRegion");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initialsFor(value) {
      const compact = String(value).replace(/\s+/g, "");
      return compact.slice(0, 2).toUpperCase();
    }

    function getVisibleServers() {
      const platformTerm = state.filters.platform.trim().toLocaleLowerCase();
      const companyTerm = state.filters.company.trim().toLocaleLowerCase();

      return state.servers.filter((server) => {
        const matchesPlatform = !platformTerm || server.platform.toLocaleLowerCase().includes(platformTerm);
        const matchesCompany = !companyTerm || server.company.toLocaleLowerCase().includes(companyTerm);
        return matchesPlatform && matchesCompany;
      });
    }

    function renderTable() {
      const visibleServers = getVisibleServers();
      state.visibleIds = visibleServers.map((server) => server.id);

      tableBody.innerHTML = visibleServers.map((server) => {
        const isSelected = state.selectedIds.has(server.id);
        return `
          <tr class="${isSelected ? "is-selected" : ""}" data-server-id="${server.id}">
            <td>
              <label class="checkbox-wrap">
                <span class="sr-only">选择 ${escapeHtml(server.platform)}</span>
                <input class="table-check row-check" type="checkbox" value="${server.id}" ${isSelected ? "checked" : ""}>
              </label>
            </td>
            <td>
              <a class="platform-cell" href="${escapeHtml(server.platformUrl)}" target="_blank" rel="noreferrer" title="打开 ${escapeHtml(server.platform)} 官网">
                <span class="platform-mark ${server.darkMark ? "platform-mark--dark" : ""}">${escapeHtml(server.initials || initialsFor(server.platform))}</span>
                <span>${escapeHtml(server.platform)}</span>
              </a>
            </td>
            <td>
              <a class="company-cell" href="${escapeHtml(server.companyUrl)}" target="_blank" rel="noreferrer" title="打开 ${escapeHtml(server.company)} 官网">
                ${escapeHtml(server.company)}
              </a>
            </td>
            <td>
              <span class="api" title="${escapeHtml(server.api)}">${escapeHtml(server.api)}</span>
            </td>
          </tr>
        `;
      }).join("");

      const hasRows = visibleServers.length > 0;
      emptyState.hidden = hasRows;
      document.querySelector(".table-scroll").hidden = !hasRows;

      const allVisibleSelected = hasRows && visibleServers.every((server) => state.selectedIds.has(server.id));
      const someVisibleSelected = hasRows && visibleServers.some((server) => state.selectedIds.has(server.id));
      selectAll.checked = allVisibleSelected;
      selectAll.indeterminate = someVisibleSelected && !allVisibleSelected;

      const selectedTotal = state.selectedIds.size;
      selectedCount.textContent = selectedTotal ? `已选择 ${selectedTotal} 项` : "未选择";
      selectedCount.classList.toggle("has-selection", selectedTotal > 0);
      deleteButton.disabled = selectedTotal === 0;
      totalCount.textContent = `共 ${state.servers.length} 个服务器`;
      footerCount.textContent = hasRows
        ? `显示 ${visibleServers.length} 条记录`
        : "显示 0 条记录";
    }

    function updateSelection(serverId, checked) {
      if (checked) {
        state.selectedIds.add(serverId);
      } else {
        state.selectedIds.delete(serverId);
      }
      renderTable();
    }

    function openModal(modal) {
      modal.hidden = false;
      document.body.style.overflow = "hidden";
      const focusTarget = modal.querySelector("input, button");
      window.setTimeout(() => focusTarget?.focus(), 0);
    }

    function closeModal(modal) {
      modal.hidden = true;
      if (deleteModal.hidden) {
        document.body.style.overflow = "";
      }
    }

    function closeSidebar() {
      sidebar.classList.remove("is-open");
      mobileOverlay.classList.remove("is-visible");
      menuToggle.setAttribute("aria-expanded", "false");
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      toastRegion.appendChild(toast);

      window.setTimeout(() => {
        toast.classList.add("is-leaving");
        window.setTimeout(() => toast.remove(), 190);
      }, 2800);
    }

    function toServerViewModel(server) {
      const homepage = server.home_url || "#";
      return {
        id: Number(server.id),
        platform: server.plat_name,
        platformUrl: homepage,
        initials: initialsFor(server.plat_name),
        company: server.co_name,
        companyUrl: homepage,
        api: server.base_url,
        darkMark: false
      };
    }

    async function loadServers(showRefreshToast = false) {
      state.filters.platform = platformSearch.value;
      state.filters.company = companySearch.value;

      const params = new URLSearchParams();
      if (state.filters.platform.trim()) {
        params.set("platform", state.filters.platform.trim());
      }
      if (state.filters.company.trim()) {
        params.set("company", state.filters.company.trim());
      }

      try {
        const query = params.toString();
        const response = await fetch(`/api/servers${query ? `?${query}` : ""}`);
        const result = await response.json().catch(() => []);

        if (!response.ok) {
          throw new Error(result.error || "服务器列表加载失败");
        }

        state.servers = result.map(toServerViewModel);
        state.selectedIds.clear();
        renderTable();

        if (showRefreshToast) {
          showToast("服务器列表已刷新");
        }
      } catch (error) {
        showToast(error.message || "服务器列表加载失败");
      }
    }

    function showAddedToast() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("added") !== "1") {
        return;
      }

      window.history.replaceState(null, "", window.location.pathname);
      showToast("服务器信息已保存");
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      loadServers();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      platformSearch.value = "";
      companySearch.value = "";
      state.filters.platform = "";
      state.filters.company = "";
      state.selectedIds.clear();
      loadServers();
      platformSearch.focus();
    });

    selectAll.addEventListener("change", () => {
      state.visibleIds.forEach((id) => {
        if (selectAll.checked) {
          state.selectedIds.add(id);
        } else {
          state.selectedIds.delete(id);
        }
      });
      renderTable();
    });

    tableBody.addEventListener("change", (event) => {
      if (!event.target.classList.contains("row-check")) {
        return;
      }
      updateSelection(Number(event.target.value), event.target.checked);
    });

    tableBody.addEventListener("click", (event) => {
      const placeholderLink = event.target.closest('a[href="#"]');
      if (!placeholderLink) {
        return;
      }
      event.preventDefault();
      showToast("该服务器暂未配置官网链接");
    });

    deleteButton.addEventListener("click", () => {
      const selectedServers = state.servers.filter((server) => state.selectedIds.has(server.id));
      deleteConfirmCopy.innerHTML = `将删除 <strong>${selectedServers.length}</strong> 个服务器配置，此操作无法撤销。`;
      openModal(deleteModal);
    });

    document.getElementById("confirmDeleteButton").addEventListener("click", async (event) => {
      const deleteConfirmButton = event.currentTarget;
      const deletedCount = state.selectedIds.size;
      const ids = [...state.selectedIds];
      deleteConfirmButton.disabled = true;

      try {
        const response = await fetch("/api/servers", {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ids })
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || "服务器删除失败");
        }

        closeModal(deleteModal);
        await loadServers();
        showToast(`已删除 ${result.deleted ?? deletedCount} 个服务器`);
      } catch (error) {
        showToast(error.message || "服务器删除失败");
      } finally {
        deleteConfirmButton.disabled = false;
      }
    });

    document.querySelectorAll("[data-close-modal]").forEach((button) => {
      button.addEventListener("click", () => {
        closeModal(document.getElementById(button.dataset.closeModal));
      });
    });

    document.querySelectorAll(".modal-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("mousedown", (event) => {
        if (event.target === backdrop) {
          closeModal(backdrop);
        }
      });
    });

    document.querySelectorAll("[data-collapse]").forEach((button) => {
      button.addEventListener("click", () => {
        const target = document.getElementById(button.dataset.collapse);
        const expanded = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", String(!expanded));
        target.hidden = expanded;
      });
    });

    document.getElementById("refreshButton").addEventListener("click", (event) => {
      const icon = event.currentTarget.querySelector("svg");
      icon.animate(
        [
          { transform: "rotate(0deg)" },
          { transform: "rotate(360deg)" }
        ],
        { duration: 480, easing: "ease-out" }
      );
      loadServers(true);
    });

    menuToggle.addEventListener("click", () => {
      const isOpen = sidebar.classList.toggle("is-open");
      mobileOverlay.classList.toggle("is-visible", isOpen);
      menuToggle.setAttribute("aria-expanded", String(isOpen));
    });

    mobileOverlay.addEventListener("click", closeSidebar);

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") {
        return;
      }
      if (!deleteModal.hidden) {
        closeModal(deleteModal);
      } else {
        closeSidebar();
      }
    });

    document.querySelectorAll('a[href^="#"]:not([data-view])').forEach((link) => {
      link.addEventListener("click", (event) => {
        const href = link.getAttribute("href");
        if (href === "#") {
          event.preventDefault();
          showToast("该服务器暂未配置官网链接");
        }
        closeSidebar();
      });
    });

    document.querySelectorAll("[data-view]").forEach((link) => {
      link.addEventListener("click", () => {
        closeSidebar();
      });
    });

    showAddedToast();
    loadServers();
  </script>
</body>
</html>
