<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111314">
  <title>Improve_Prompt - 添加模型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1112;
      --sidebar: #141617;
      --surface: #181a1b;
      --surface-hover: #222526;
      --line: #2b2f30;
      --text: #f4f5f4;
      --text-soft: #b8bdbc;
      --muted: #7e8583;
      --accent: #d9ff66;
      --accent-soft: rgba(217, 255, 102, 0.12);
      --danger: #ff7676;
      --success: #72dc9a;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 76% -14%, rgba(217, 255, 102, 0.055), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: block;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 282px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      width: 282px;
      height: 100vh;
      padding: 22px 16px 18px;
      overflow-y: auto;
      background: rgba(20, 22, 23, 0.97);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 0 8px;
      margin-bottom: 30px;
    }

    .brand__logo {
      position: relative;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      overflow: hidden;
      background: #0c0e0f;
      border: 1px solid #424849;
      border-radius: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .brand__logo::before,
    .brand__logo::after {
      position: absolute;
      width: 14px;
      height: 20px;
      content: "";
      border: 1.5px solid var(--accent);
      border-radius: 5px 5px 5px 1px;
      transform: rotate(-22deg) translate(-3px, 1px);
      opacity: 0.95;
    }

    .brand__logo::after {
      width: 8px;
      height: 13px;
      border-color: rgba(244, 245, 244, 0.74);
      transform: rotate(-22deg) translate(6px, -3px);
    }

    .brand__name {
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-label {
      padding: 0 10px;
      margin-bottom: 9px;
      color: #666d6b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-tree {
      display: grid;
      gap: 4px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 40px;
      padding: 0 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-soft);
      cursor: pointer;
      text-align: left;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .nav-row:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.035);
    }

    .nav-row:focus-visible,
    .button:focus-visible,
    .icon-button:focus-visible,
    .link-button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .multi-select__trigger:focus-visible {
      outline: 2px solid rgba(217, 255, 102, 0.7);
      outline-offset: 2px;
    }

    .nav-row--level1 {
      color: #e8eae9;
      font-weight: 650;
    }

    .nav-row--level2 {
      min-height: 36px;
      padding-left: 14px;
      color: #9fa5a4;
      font-size: 13px;
    }

    .nav-row--level3 {
      min-height: 34px;
      padding: 0 9px 0 34px;
      color: #818886;
      font-size: 13px;
    }

    .nav-row--level3::before {
      width: 4px;
      height: 4px;
      margin-right: 10px;
      background: currentColor;
      border-radius: 50%;
      content: "";
      opacity: 0.7;
    }

    .nav-row--level3:hover,
    .nav-row--level3.is-active {
      color: var(--text);
      background: var(--surface-hover);
      border-color: #303536;
    }

    .nav-row--level3.is-active::before {
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .nav-row--link {
      font-weight: 650;
    }

    .nav-row__icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-right: 8px;
      color: #8f9694;
      background: #1c1f20;
      border: 1px solid #2c3031;
      border-radius: 7px;
    }

    .nav-row__icon svg {
      width: 15px;
      height: 15px;
    }

    .nav-row__text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-row__chevron {
      width: 15px;
      height: 15px;
      margin-left: auto;
      color: #6f7674;
      transition: transform 180ms ease;
    }

    .nav-row[aria-expanded="false"] .nav-row__chevron {
      transform: rotate(-90deg);
    }

    .nav-subtree {
      display: grid;
      grid-template-rows: 1fr;
    }

    .nav-subtree[hidden] {
      display: none;
    }

    .nav-subtree__inner {
      display: grid;
      gap: 3px;
      min-height: 0;
      margin-top: 3px;
      overflow: hidden;
    }

    .nav-subtree--level3 .nav-subtree__inner {
      margin: 2px 0 5px 23px;
      padding-left: 8px;
      border-left: 1px solid #292d2e;
    }

    .sidebar__footer {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 10px;
      margin-top: auto;
      color: #737a78;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(114, 220, 154, 0.09);
    }

    .main {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 70px;
      padding: 14px clamp(18px, 3vw, 42px);
      background: rgba(15, 17, 18, 0.86);
      border-bottom: 1px solid rgba(43, 47, 48, 0.82);
      backdrop-filter: blur(18px);
    }

    .icon-button.menu-toggle {
      display: none;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: #727977;
      font-size: 12px;
      white-space: nowrap;
    }

    .breadcrumbs strong {
      overflow: hidden;
      color: #b6bbba;
      font-weight: 500;
      text-overflow: ellipsis;
    }

    .topbar__spacer {
      flex: 1;
    }

    .button,
    .icon-button,
    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      background: #202324;
      border: 1px solid #303536;
      border-radius: 8px;
      color: #d8dcda;
      cursor: pointer;
      font-size: 13px;
      font-weight: 620;
      white-space: nowrap;
      transition: transform 150ms ease, color 150ms ease, background 150ms ease,
        border-color 150ms ease, opacity 150ms ease;
    }

    .button:hover:not(:disabled),
    .icon-button:hover:not(:disabled),
    .link-button:hover:not(:disabled) {
      color: #fff;
      background: #272b2c;
      border-color: #414748;
    }

    .button:active:not(:disabled),
    .icon-button:active:not(:disabled),
    .link-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .button:disabled {
      color: #656b69;
      background: #191b1c;
      border-color: #272a2b;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .button svg,
    .link-button svg,
    .icon-button svg {
      width: 16px;
      height: 16px;
    }

    .button--primary {
      color: var(--text);
      background: #272b2c;
      border-color: #414748;
    }

    .button--primary:hover:not(:disabled) {
      color: #fff;
      background: #303536;
      border-color: #535a5b;
    }

    .button--primary svg {
      color: var(--accent);
    }

    .link-button {
      min-height: 34px;
      padding: 0 11px;
      background: transparent;
      border-color: transparent;
      color: #c8cdcb;
    }

    .icon-button {
      width: 38px;
      min-width: 38px;
      padding: 0;
    }

    .content {
      width: min(100%, 1540px);
      padding: 30px clamp(18px, 3vw, 42px) 48px;
      margin: 0 auto;
    }

    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 720;
      letter-spacing: 0;
    }

    .page-heading__meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .draft-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .panel {
      background: rgba(24, 26, 27, 0.97);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .form-panel {
      max-width: 1040px;
      overflow: visible;
    }

    .form-panel__header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .form-panel__icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: var(--accent);
      background: #202324;
      border: 1px solid #303536;
      border-radius: 8px;
    }

    .form-panel__icon svg {
      width: 16px;
      height: 16px;
    }

    .form-panel__title strong {
      display: block;
      font-size: 14px;
      font-weight: 680;
    }

    .form-panel__title span {
      display: block;
      margin-top: 2px;
      color: #747b79;
      font-size: 11px;
    }

    .form-body {
      padding: 22px 20px 26px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 18px;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .field--full {
      grid-column: 1 / -1;
    }

    .field__label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #a3a9a7;
      font-size: 12px;
      font-weight: 650;
    }

    .field__required {
      color: var(--accent);
      font-size: 11px;
    }

    .field__optional {
      color: #747b79;
      font-size: 11px;
    }

    .input,
    .select,
    .multi-select__trigger {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      background: #121415;
      border: 1px solid #303536;
      border-radius: 7px;
      color: var(--text);
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .input::placeholder {
      color: #606765;
    }

    .input:hover,
    .select:hover,
    .multi-select__trigger:hover {
      border-color: #3e4445;
    }

    .input:focus,
    .select:focus,
    .multi-select__trigger:focus {
      background: #101213;
      border-color: rgba(217, 255, 102, 0.62);
      box-shadow: 0 0 0 3px rgba(217, 255, 102, 0.08);
    }

    .input[aria-invalid="true"],
    .select[aria-invalid="true"],
    .multi-select__trigger[aria-invalid="true"] {
      border-color: rgba(255, 118, 118, 0.68);
      box-shadow: 0 0 0 3px rgba(255, 118, 118, 0.07);
    }

    .field__error {
      min-height: 15px;
      margin: -3px 0 0;
      color: #ff9b9b;
      font-size: 11px;
      line-height: 1.35;
    }

    .select-wrap {
      position: relative;
    }

    .select {
      appearance: none;
      padding-right: 42px;
      cursor: pointer;
    }

    .select option {
      color: var(--text);
      background: #1b1e1f;
    }

    .select-wrap__chevron {
      position: absolute;
      top: 50%;
      right: 13px;
      width: 15px;
      height: 15px;
      color: #8b9290;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .multi-select {
      position: relative;
    }

    .multi-select__trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
    }

    .multi-select__trigger span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .multi-select__trigger span.is-placeholder {
      color: #606765;
    }

    .multi-select__trigger svg {
      width: 15px;
      height: 15px;
      color: #8b9290;
      transition: transform 160ms ease;
    }

    .multi-select__trigger[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .multi-select__menu {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;
      left: 0;
      z-index: 60;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 6px;
      background: #1b1e1f;
      border: 1px solid #3a4041;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.42);
      animation: menu-in 140ms ease both;
    }

    .multi-select__menu[hidden] {
      display: none;
    }

    .multi-select__option {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 36px;
      padding: 0 9px;
      border-radius: 6px;
      color: #bdc2c0;
      cursor: pointer;
    }

    .multi-select__option:hover {
      color: #fff;
      background: #292d2e;
    }

    .multi-select__option input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .form-actions {
      position: sticky;
      bottom: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 20px 20px;
      background: #17191a;
      border-top: 1px solid var(--line);
      border-radius: 0 0 8px 8px;
      box-shadow: 0 -12px 28px rgba(0, 0, 0, 0.18);
    }

    .form-actions__note {
      margin-right: auto;
      color: #727977;
      font-size: 12px;
    }

    .toast-region {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 130;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 44px));
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      background: #202324;
      border: 1px solid #3c4242;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.38);
      color: #dce0de;
      font-size: 13px;
      line-height: 1.45;
      pointer-events: auto;
      animation: toast-in 220ms ease both;
    }

    .toast::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      margin-top: 5px;
      background: var(--accent);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .toast.is-leaving {
      animation: toast-out 180ms ease both;
    }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: none;
      background: rgba(4, 5, 6, 0.62);
      backdrop-filter: blur(3px);
    }

    @keyframes menu-in {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toast-out {
      to {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    @media (max-width: 1080px) {
      .app-shell {
        grid-template-columns: 244px minmax(0, 1fr);
      }

      .sidebar {
        width: 244px;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: fixed;
        left: 0;
        width: min(86vw, 300px);
        transform: translateX(-102%);
        transition: transform 210ms ease;
      }

      .sidebar.is-open {
        transform: translateX(0);
      }

      .mobile-overlay.is-visible {
        display: block;
      }

      .icon-button.menu-toggle {
        display: inline-flex;
      }

      .content {
        padding-top: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field--full {
        grid-column: auto;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        min-height: 64px;
        padding: 12px 14px;
      }

      .breadcrumbs {
        max-width: 48vw;
      }

      .topbar .link-button span {
        display: none;
      }

      .topbar .link-button {
        width: 38px;
        min-width: 38px;
        padding: 0;
      }

      .content {
        padding: 22px 14px 38px;
      }

      .page-heading {
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .page-heading__meta {
        padding-top: 8px;
      }

      .form-panel__header,
      .form-body {
        padding-right: 14px;
        padding-left: 14px;
      }

      .form-body {
        padding-top: 18px;
        padding-bottom: 20px;
      }

      .multi-select__menu {
        grid-template-columns: 1fr;
      }

      .form-actions {
        align-items: stretch;
        padding: 14px;
      }

      .form-actions__note {
        display: none;
      }

      .form-actions .button {
        flex: 1;
      }

      .toast-region {
        right: 14px;
        bottom: 14px;
        width: calc(100vw - 28px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true"></span>
        <span class="brand__name">Improve_Prompt</span>
      </div>

      <div class="nav-label">菜单</div>
      <nav class="nav-tree">
        <button class="nav-row nav-row--level1" type="button" data-collapse="basicMenu" aria-expanded="true">
          <span class="nav-row__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.5h16v13H4z"></path>
              <path d="M8 9h8M8 13h5"></path>
            </svg>
          </span>
          <span class="nav-row__text">基础信息</span>
          <svg class="nav-row__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>

        <div class="nav-subtree" id="basicMenu">
          <div class="nav-subtree__inner">
            <button class="nav-row nav-row--level2" type="button" data-collapse="serverMenu" aria-expanded="true">
              <span class="nav-row__text">模型服务器</span>
              <svg class="nav-row__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </button>
            <div class="nav-subtree nav-subtree--level3" id="serverMenu">
              <div class="nav-subtree__inner">

        <form class="panel form-panel" id="modelForm" novalidate>
          <div class="form-panel__header">
            <span class="form-panel__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5 20 8v8l-8 4.5L4 16V8z"></path>
                <path d="m4 8 8 4.5L20 8M12 12.5V20"></path>
              </svg>
            </span>
            <div class="form-panel__title">
              <strong>模型信息</strong>
            </div>
          </div>

          <div class="form-body">
            <div class="form-grid">
              <label class="field">
                <span class="field__label">
                  <span>服务器</span>
                  <span class="field__required">必填</span>
                </span>
                <span class="select-wrap">
                  <select class="select" id="serverInput" name="server" required>
                    <option value="">请选择服务器</option>
                    <option value="OpenAI">OpenAI</option>
                    <option value="Anthropic">Anthropic</option>
                    <option value="Google AI">Google AI</option>
                    <option value="DeepSeek">DeepSeek</option>
                    <option value="硅基流动">硅基流动</option>
                    <option value="OpenRouter">OpenRouter</option>
                    <option value="魔搭社区">魔搭社区</option>
                  </select>
                  <svg class="select-wrap__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </span>
                <span class="field__error" id="serverError"></span>
              </label>

              <label class="field">
                <span class="field__label">
                  <span>模型名</span>
                  <span class="field__required">必填</span>
                </span>
                <input class="input" id="modelNameInput" name="modelName" type="text" placeholder="输入模型名称" autocomplete="off" required>
                <span class="field__error" id="modelNameError"></span>
              </label>

              <label class="field">
                <span class="field__label">
                  <span>输入 Token 计费（¥）</span>
                  <span class="field__required">必填</span>
                </span>
                <input
                  class="input"
                  id="inputCostInput"
                  name="inputCost"
                  type="text"
                  inputmode="decimal"
                  placeholder="例如：0.50"
                  autocomplete="off"
                  required
                >
                <span class="field__error" id="inputCostError"></span>
              </label>

              <label class="field">
                <span class="field__label">
                  <span>输出 Token 计费（¥）</span>
                  <span class="field__optional">选填</span>
                </span>
                <input
                  class="input"
                  id="outputCostInput"
                  name="outputCost"
                  type="text"
                  inputmode="decimal"
                  placeholder="没有输出可留空"
                  autocomplete="off"
                >
                <span class="field__error" id="outputCostError"></span>
              </label>

              <label class="field">
                <span class="field__label">
                  <span>单位</span>
                  <span class="field__required">必填</span>
                </span>
                <span class="select-wrap">
                  <select class="select" id="unitInput" name="unit" required>
                    <option value="">请选择单位</option>
                    <option value="K">K</option>
                    <option value="万">万</option>
                    <option value="十万">十万</option>
                    <option value="百万">百万</option>
                  </select>
                  <svg class="select-wrap__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </span>
                <span class="field__error" id="unitError"></span>
              </label>

              <div class="field">
                <span class="field__label">
                  <span>类型</span>
                  <span class="field__required">可多选</span>
                </span>
                <div class="multi-select" id="typeSelect">
                  <button class="multi-select__trigger" id="typeTrigger" type="button" aria-expanded="false" aria-controls="typeMenu" aria-invalid="false">
                    <span class="is-placeholder" id="typeSummary">请选择模型类型</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="m6 9 6 6 6-6"></path>
                    </svg>
                  </button>
                  <div class="multi-select__menu" id="typeMenu" hidden>
                    <label class="multi-select__option"><input type="checkbox" value="对话">对话</label>
                    <label class="multi-select__option"><input type="checkbox" value="视频">视频</label>
                    <label class="multi-select__option"><input type="checkbox" value="嵌入">嵌入</label>
                    <label class="multi-select__option"><input type="checkbox" value="生图">生图</label>
                    <label class="multi-select__option"><input type="checkbox" value="语音">语音</label>
                    <label class="multi-select__option"><input type="checkbox" value="重排">重排</label>
                  </div>
                </div>
                <span class="field__error" id="typeError"></span>
              </div>

              <label class="field field--full">
                <span class="field__label">
                  <span>网址</span>
                  <span class="field__required">必填</span>
                </span>
                <input
                  class="input"
                  id="urlInput"
                  name="url"
                  type="text"
                  inputmode="url"
                  placeholder="https://example.com/model"
                  autocomplete="url"
                  required
                >
                <span class="field__error" id="urlError"></span>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <span class="form-actions__note">必填项不可为空</span>
            <button class="button" type="button" id="cancelButton">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"></path>
              </svg>
              <span>取消</span>
            </button>
            <button class="button button--primary" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 4h12l2 2v14H5z"></path>
                <path d="M8 4v6h8V4M8 20v-6h8v6"></path>
              </svg>
              <span>保存</span>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script>
    const modelForm = document.getElementById("modelForm");
    const serverInput = document.getElementById("serverInput");
    const modelNameInput = document.getElementById("modelNameInput");
    const inputCostInput = document.getElementById("inputCostInput");
    const outputCostInput = document.getElementById("outputCostInput");
    const unitInput = document.getElementById("unitInput");
    const urlInput = document.getElementById("urlInput");
    const typeSelect = document.getElementById("typeSelect");
    const typeTrigger = document.getElementById("typeTrigger");
    const typeMenu = document.getElementById("typeMenu");
    const typeSummary = document.getElementById("typeSummary");
    const typeCheckboxes = [...typeMenu.querySelectorAll('input[type="checkbox"]')];
    const cancelButton = document.getElementById("cancelButton");
    const sidebar = document.getElementById("sidebar");
    const mobileOverlay = document.getElementById("mobileOverlay");
    const menuToggle = document.getElementById("menuToggle");
    const toastRegion = document.getElementById("toastRegion");

    const fields = {
      server: {
        input: serverInput,
        error: document.getElementById("serverError"),
        validate: (value) => value ? "" : "请选择服务器"
      },
      modelName: {
        input: modelNameInput,
        error: document.getElementById("modelNameError"),
        validate: (value) => value ? "" : "请输入模型名称"
      },
      inputCost: {
        input: inputCostInput,
        error: document.getElementById("inputCostError"),
        validate: validateCost
      },
      outputCost: {
        input: outputCostInput,
        error: document.getElementById("outputCostError"),
        validate: validateOptionalCost
      },
      unit: {
        input: unitInput,
        error: document.getElementById("unitError"),
        validate: (value) => value ? "" : "请选择计费单位"
      },
      url: {
        input: urlInput,
        error: document.getElementById("urlError"),
        validate: validateUrl
      }
    };

    function validateCost(value) {
      if (!value) {
        return "请输入 Token 计费";
      }
      if (!/^\d+(\.\d+)?$/.test(value) || Number(value) < 0) {
        return "只能输入数字和小数点";
      }
      return "";
    }

    function validateOptionalCost(value) {
      return value ? validateCost(value) : "";
    }

    function validateUrl(value) {
      if (!value) {
        return "请输入网址";
      }
      try {
        const url = new URL(value);
        return url.protocol === "http:" || url.protocol === "https:"
          ? ""
          : "请输入完整的 http:// 或 https:// 地址";
      } catch {
        return "请输入完整的 http:// 或 https:// 地址";
      }
    }

    function sanitizeDecimal(input) {
      let value = input.value.replace(/[^\d.]/g, "");
      const firstDot = value.indexOf(".");
      if (firstDot !== -1) {
        value = `${value.slice(0, firstDot + 1)}${value.slice(firstDot + 1).replaceAll(".", "")}`;
      }
      input.value = value;
    }

    function getSelectedTypes() {
      return typeCheckboxes
        .filter((checkbox) => checkbox.checked)
        .map((checkbox) => checkbox.value);
    }

    function updateTypeSummary() {
      const selectedTypes = getSelectedTypes();
      typeSummary.classList.toggle("is-placeholder", selectedTypes.length === 0);
      if (!selectedTypes.length) {
        typeSummary.textContent = "请选择模型类型";
      } else if (selectedTypes.length === 1) {
        typeSummary.textContent = selectedTypes[0];
      } else {
        typeSummary.textContent = `${selectedTypes[0]} 等 ${selectedTypes.length} 项`;
      }
    }

    function openTypeMenu() {
      typeMenu.hidden = false;
      typeTrigger.setAttribute("aria-expanded", "true");
    }

    function closeTypeMenu() {
      typeMenu.hidden = true;
      typeTrigger.setAttribute("aria-expanded", "false");
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      toastRegion.appendChild(toast);

      window.setTimeout(() => {
        toast.classList.add("is-leaving");
        window.setTimeout(() => toast.remove(), 190);
      }, 2400);
    }

    function clearFieldError(field) {
      field.input.setAttribute("aria-invalid", "false");
      field.error.textContent = "";
    }

    function setFieldError(field, message) {
      field.input.setAttribute("aria-invalid", "true");
      field.error.textContent = message;
    }

    function validateForm() {
      let firstInvalidInput = null;

      Object.values(fields).forEach((field) => {
        const message = field.validate(field.input.value.trim());
        if (message) {
          setFieldError(field, message);
          firstInvalidInput ||= field.input;
        } else {
          clearFieldError(field);
        }
      });

      const selectedTypes = getSelectedTypes();
      if (!selectedTypes.length) {
        typeTrigger.setAttribute("aria-invalid", "true");
        document.getElementById("typeError").textContent = "请至少选择一种模型类型";
        firstInvalidInput ||= typeTrigger;
      } else {
        typeTrigger.setAttribute("aria-invalid", "false");
        document.getElementById("typeError").textContent = "";
      }

      if (firstInvalidInput) {
        firstInvalidInput.focus();
        return false;
      }
      return true;
    }

    typeTrigger.addEventListener("click", () => {
      if (typeMenu.hidden) {
        openTypeMenu();
      } else {
        closeTypeMenu();
      }
    });

    typeCheckboxes.forEach((checkbox) => {
      checkbox.addEventListener("change", () => {
        updateTypeSummary();
        typeTrigger.setAttribute("aria-invalid", "false");
        document.getElementById("typeError").textContent = "";
      });
    });

    [inputCostInput, outputCostInput].forEach((input) => {
      input.addEventListener("input", () => sanitizeDecimal(input));
    });

    Object.values(fields).forEach((field) => {
      field.input.addEventListener("input", () => clearFieldError(field));
      field.input.addEventListener("change", () => clearFieldError(field));
    });

    modelForm.addEventListener("submit", (event) => {
      event.preventDefault();
      closeTypeMenu();

      if (!validateForm()) {
        showToast("请先完善模型信息");
        return;
      }

      const submitButton = modelForm.querySelector('button[type="submit"]');
      const submitLabel = submitButton.querySelector("span");
      const selectedTypes = getSelectedTypes();
      const outputCost = outputCostInput.value.trim() || "0";

      submitButton.disabled = true;
      submitLabel.textContent = "保存中";
      showToast("保存成功");

      const params = new URLSearchParams({
        added: "1",
        platform: serverInput.value,
        model: modelNameInput.value.trim(),
        inputCost: inputCostInput.value,
        outputCost,
        unit: unitInput.value,
        type: selectedTypes.join(","),
        url: urlInput.value.trim()
      });

      window.setTimeout(() => {
        window.location.href = `model_list.html?${params.toString()}`;
      }, 700);
    });

    cancelButton.addEventListener("click", () => {
      window.location.href = "model_list.html";
    });

    document.addEventListener("mousedown", (event) => {
      if (!typeSelect.contains(event.target)) {
        closeTypeMenu();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (!typeMenu.hidden) {
          closeTypeMenu();
        } else {
          closeSidebar();
        }
      }
    });

    document.querySelectorAll("[data-collapse]").forEach((button) => {
      button.addEventListener("click", () => {
        const target = document.getElementById(button.dataset.collapse);
        const expanded = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", String(!expanded));
        target.hidden = expanded;
      });
    });

    function closeSidebar() {
      sidebar.classList.remove("is-open");
      mobileOverlay.classList.remove("is-visible");
      menuToggle.setAttribute("aria-expanded", "false");
    }

    menuToggle.addEventListener("click", () => {
      const isOpen = sidebar.classList.toggle("is-open");
      mobileOverlay.classList.toggle("is-visible", isOpen);
      menuToggle.setAttribute("aria-expanded", String(isOpen));
    });

    mobileOverlay.addEventListener("click", closeSidebar);

    document.querySelectorAll('a[href="#debug"]').forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        showToast("该功能暂未接入当前原型");
      });
    });

    updateTypeSummary();
  </script>
