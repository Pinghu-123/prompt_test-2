<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Improve_Prompt</title>
  <style>
    html,
    body,
    #app {
      min-height: 100%;
      margin: 0;
    }

    html.scroll-page,
    html.scroll-page body,
    html.scroll-page #app {
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    html.scroll-page .app-shell {
      height: 100vh;
      min-height: 0;
    }

    html.scroll-page .main {
      height: 100vh;
      min-height: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      scrollbar-color: #4b5250 #17191a;
      scrollbar-width: auto;
    }

    html.scroll-page .main::-webkit-scrollbar {
      width: 14px;
    }

    html.scroll-page .main::-webkit-scrollbar-track {
      background: #17191a;
      border-left: 1px solid #2b2f30;
    }

    html.scroll-page .main::-webkit-scrollbar-thumb {
      min-height: 52px;
      background: #4b5250;
      border: 3px solid #17191a;
      border-radius: 999px;
    }

    html.scroll-page .main::-webkit-scrollbar-thumb:hover {
      background: #626b68;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="db_schema.js"></script>
  <script src="bridge.js"></script>
</body>
</html>
